name: "Release: legacy atmosphere.js 4.x (npm)"

# Publishes the legacy 4.x browser client (Atmosphere/atmosphere-javascript) to npm
# as atmosphere.js under a non-latest dist-tag. The 4.x npm package is the
# Atmosphere/atmosphere.js-node wrapper around the atmosphere.js file released with
# the matching javascript-project-<version> tag, so both repositories are checked out
# and the file is compared before publishing.
#
# Auth is the NPM_TOKEN repository secret. Trusted Publishing (release-4x.yml) is not
# used: npm attaches provenance to OIDC publishes, and provenance rejects a package
# whose repository.url (atmosphere.js-node) is not the repository running the workflow.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Full commit SHA of Atmosphere/atmosphere.js-node to publish'
        required: true
        type: string
      dist_tag:
        description: 'npm dist-tag (never latest: latest belongs to atmosphere.js 5.x)'
        required: true
        type: string
        default: 'legacy'

jobs:
  publish:
    name: Publish atmosphere.js 4.x to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Reject the latest dist-tag
      env:
        DIST_TAG: ${{ inputs.dist_tag }}
      run: |
        if [ -z "$DIST_TAG" ] || [ "$DIST_TAG" = "latest" ]; then
          echo "::error::dist_tag must be set and must not be 'latest' (atmosphere.js 5.x owns latest)"
          exit 1
        fi

    - name: Checkout atmosphere.js-node
      uses: actions/checkout@v7
      with:
        repository: Atmosphere/atmosphere.js-node
        ref: ${{ inputs.ref }}
        path: node

    - name: Read package version
      id: pkg
      working-directory: node
      run: |
        VERSION=$(node -p "require('./package.json').version")
        case "$VERSION" in
          4.*) ;;
          *) echo "::error::package.json version $VERSION is not a 4.x legacy release"; exit 1 ;;
        esac
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Checkout atmosphere-javascript release tag
      uses: actions/checkout@v7
      with:
        repository: Atmosphere/atmosphere-javascript
        ref: javascript-project-${{ steps.pkg.outputs.version }}
        path: browser

    - name: Verify the wrapper ships the released client
      run: |
        cmp node/lib/atmosphere.js browser/modules/javascript/src/main/webapp/javascript/atmosphere.js
        echo "lib/atmosphere.js matches javascript-project-${{ steps.pkg.outputs.version }}"

    - name: Setup Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'

    - name: Publish to npm
      working-directory: node
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        DIST_TAG: ${{ inputs.dist_tag }}
        VERSION: ${{ steps.pkg.outputs.version }}
      run: |
        set -euo pipefail
        if [ "$(npm view "atmosphere.js@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
          echo "atmosphere.js@$VERSION is already on npm — nothing to publish"
          exit 0
        fi
        LATEST_BEFORE=$(npm view atmosphere.js dist-tags.latest)
        echo "latest before publish: $LATEST_BEFORE"
        npm pack --dry-run
        npm publish --tag "$DIST_TAG" --access public

        for attempt in $(seq 1 30); do
          if [ "$(npm view "atmosphere.js@$VERSION" version 2>/dev/null || true)" = "$VERSION" ]; then
            break
          fi
          if [ "$attempt" = 30 ]; then
            echo "::error::atmosphere.js@$VERSION is not served by npm after 5 minutes"
            exit 1
          fi
          sleep 10
        done

        LATEST_AFTER=$(npm view atmosphere.js dist-tags.latest)
        if [ "$LATEST_AFTER" != "$LATEST_BEFORE" ]; then
          npm dist-tag add "atmosphere.js@$LATEST_BEFORE" latest
          echo "::error::publishing moved latest from $LATEST_BEFORE to $LATEST_AFTER; restored $LATEST_BEFORE"
          exit 1
        fi
        echo "verified: atmosphere.js@$VERSION is live under '$DIST_TAG', latest is still $LATEST_AFTER"
        npm view atmosphere.js dist-tags
