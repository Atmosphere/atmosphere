name: "CI: Gate Self-Test"

# Proves that every check in architectural-validation.sh actually fails on a
# violation. Without this, a check that has only ever printed PASS is
# indistinguishable from a check that cannot fail — which is not hypothetical:
# six no-ops were found in that script in two days (an undefined path variable
# making rg read stdin, a missing rg binary with suppressed stderr, an empty
# allowlist turning `grep -vE` into match-everything, a heredoc stealing stdin
# from a pipeline, and two regexes whose word boundaries could never match the
# spellings their own extractors targeted). Every one printed PASS.
#
# Path-filtered to the gate itself and to every file a case injects into
# (INJECT_TRACKED in scripts/lib/prove_gate.sh, which fails when one is missing
# here): the suite runs the full gate once per case, which is only worth paying
# when the gate, its config or a file a case edits and asserts on changes. A refactor of one of those files can turn
# its case into a NO-OP (s_ai_stale asserts LlmReranker still holds the read it
# rewrites), and that must surface on the change that caused it.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/architectural-validation.sh'
      - 'scripts/validation-patterns.toml'
      - 'scripts/lib/**'
      - 'scripts/validate-no-hardcoded-atmosphere-version.sh'
      - '.github/workflows/gate-selftest.yml'
      - '.github/workflows/e2e.yml'
      - 'modules/cpr/src/main/java/org/atmosphere/util/SimpleBroadcaster.java'
      - 'modules/cpr/src/test/java/org/atmosphere/inject/InjectableObjectFactoryTest.java'
      - 'modules/anthropic/src/test/java/org/atmosphere/ai/anthropic/AnthropicRuntimeContractTest.java'
      - 'samples/grpc-chat/src/main/java/org/atmosphere/samples/grpc/GrpcChatServer.java'
      - 'modules/ai/src/main/java/org/atmosphere/ai/AiConfig.java'
      - 'modules/ai/src/main/java/org/atmosphere/ai/LlmReranker.java'
      - 'modules/ai/src/main/java/org/atmosphere/ai/memory/LongTermMemories.java'
      - 'modules/ai/src/main/java/org/atmosphere/ai/processor/AiEndpointProcessor.java'
      - 'modules/kotlin/src/main/kotlin/org/atmosphere/kotlin/ai/AgentRegistration.kt'
      - 'modules/quarkus-extension/runtime/src/main/java/org/atmosphere/quarkus/runtime/AtmosphereBootstrap.java'
  pull_request:
    paths:
      - 'scripts/architectural-validation.sh'
      - 'scripts/validation-patterns.toml'
      - 'scripts/lib/**'
      - 'scripts/validate-no-hardcoded-atmosphere-version.sh'
      - '.github/workflows/gate-selftest.yml'
      - '.github/workflows/e2e.yml'
      - 'modules/cpr/src/main/java/org/atmosphere/util/SimpleBroadcaster.java'
      - 'modules/cpr/src/test/java/org/atmosphere/inject/InjectableObjectFactoryTest.java'
      - 'modules/anthropic/src/test/java/org/atmosphere/ai/anthropic/AnthropicRuntimeContractTest.java'
      - 'samples/grpc-chat/src/main/java/org/atmosphere/samples/grpc/GrpcChatServer.java'
      - 'modules/ai/src/main/java/org/atmosphere/ai/AiConfig.java'
      - 'modules/ai/src/main/java/org/atmosphere/ai/LlmReranker.java'
      - 'modules/ai/src/main/java/org/atmosphere/ai/memory/LongTermMemories.java'
      - 'modules/ai/src/main/java/org/atmosphere/ai/processor/AiEndpointProcessor.java'
      - 'modules/kotlin/src/main/kotlin/org/atmosphere/kotlin/ai/AgentRegistration.kt'
      - 'modules/quarkus-extension/runtime/src/main/java/org/atmosphere/quarkus/runtime/AtmosphereBootstrap.java'
  workflow_dispatch:

jobs:
  prove-gate:
    name: Prove every check bites
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    # ubuntu-latest does not ship ripgrep, and the gate suppresses rg's stderr —
    # so without this the gate finds nothing and passes vacuously, and this
    # suite would "prove" a gate that isn't running.
    - name: Install ripgrep
      run: |
        command -v rg > /dev/null 2>&1 || sudo apt-get install -y -qq ripgrep
        rg --version | head -1

    - name: Scanner self-test
      run: python3 scripts/lib/source_scan.py --self-test

    - name: Prove every check fails on a violation
      run: ./scripts/lib/prove_gate.sh
