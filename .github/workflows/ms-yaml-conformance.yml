name: "CI: MS Agent Governance YAML Conformance"

# Tier 7.1 — weekly diff against the upstream ACS manifest contract fixtures
# (the engine Microsoft's Agent Governance Toolkit depends on). Guards the
# claim that Atmosphere parses MS
# Agent Control Specification manifests byte-for-byte: if upstream changes the
# manifest shape (ACS is public preview — it will), the workflow opens an
# issue and fails loudly instead of letting our copies drift silently.
#
# The fixture directory is modules/ai/src/test/resources/ms-acs/, a verbatim
# copy of the ACS engine's own contract fixtures at
# engine/tests/fixtures/manifests/ in responsibleai/agent-control-spec — the
# files the engine's test suite pins the manifest shape with.
# AcsManifestConformanceTest (runs in CI: Core) asserts the shipped parser
# accepts every file in that directory; this workflow keeps the directory
# aligned with upstream main.
#
# History: the workflow originally diffed docs/tutorials/policy-as-code/
# examples, the pre-ACS policy YAML dialect. Upstream deleted that directory
# on 2026-07-30 (commit 8149ebf93d, "refactor(v4-removal)!") in favour of ACS
# manifests. The legacy dialect fixtures remain frozen under
# modules/ai/src/test/resources/ms-agent-os/, pinned by
# MsAgentOsYamlConformanceTest — they are no longer diffed upstream because
# upstream no longer ships them. The ACS fixtures were then diffed against
# microsoft/agent-governance-toolkit's policy-engine/core/tests/fixtures/
# manifests/ until upstream commit cdb87ad523 (2026-09-13) deleted that
# directory when the toolkit retargeted onto the published agent-control-spec
# engine (see its policy-engine/docs/acs-retarget.md); the same two fixtures
# now live in responsibleai/agent-control-spec, which this workflow diffs.

on:
  schedule:
    # Weekly on Monday 06:00 UTC — cheap, no user impact, plenty of time
    # to land a fix before the working week starts.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'responsibleai/agent-control-spec git ref to diff against (default: main)'
        default: 'main'
        required: false
  pull_request:
    paths:
      - '.github/workflows/ms-yaml-conformance.yml'
      - 'modules/ai/src/test/resources/ms-acs/**'
      - 'modules/ai/src/test/resources/ms-agent-os/**'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diff-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Atmosphere
        uses: actions/checkout@v7

      - name: Clone ACS engine upstream
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.upstream_ref }}"
          REF="${REF:-main}"
          mkdir -p /tmp/ms-upstream
          # The ACS engine microsoft/agent-governance-toolkit depends on
          # ships at responsibleai/agent-control-spec. If the repo is moved
          # or the path changes, this block and UPSTREAM below are the things
          # to edit. init+fetch instead of clone --branch so the ref can also
          # be a bare commit SHA on manual dispatch.
          git init -q /tmp/ms-upstream
          git -C /tmp/ms-upstream remote add origin \
            https://github.com/responsibleai/agent-control-spec.git
          git -C /tmp/ms-upstream fetch -q --depth 1 origin "$REF" || {
              echo "::error::upstream repo unreachable or ref '$REF' does not exist"
              exit 1
            }
          git -C /tmp/ms-upstream checkout -q FETCH_HEAD

      - name: Diff fixtures
        id: diff
        run: |
          set -euo pipefail
          FIXTURES=modules/ai/src/test/resources/ms-acs
          UPSTREAM=/tmp/ms-upstream/engine/tests/fixtures/manifests
          if [ ! -d "$UPSTREAM" ]; then
            echo "::error::upstream ACS manifest fixtures not found at $UPSTREAM"
            exit 1
          fi
          DRIFT=""
          for f in "$FIXTURES"/*.yaml; do
            name="$(basename "$f")"
            if [ ! -f "$UPSTREAM/$name" ]; then
              DRIFT="$DRIFT\n$name: removed upstream (our copy still exists)"
              continue
            fi
            if ! diff -q "$f" "$UPSTREAM/$name" > /dev/null 2>&1; then
              DRIFT="$DRIFT\n$name: content diverged\n$(diff -u "$f" "$UPSTREAM/$name" || true)"
            fi
          done
          for f in "$UPSTREAM"/*.yaml; do
            name="$(basename "$f")"
            if [ ! -f "$FIXTURES/$name" ]; then
              DRIFT="$DRIFT\n$name: new upstream file (missing from our tree)"
            fi
          done
          if [ -n "$DRIFT" ]; then
            echo "drift<<EOF" >> "$GITHUB_OUTPUT"
            printf "%b" "$DRIFT" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            echo "::error::ACS manifest fixtures drifted from responsibleai/agent-control-spec — see step summary"
            {
              echo "## Agent Control Specification manifest drift detected (responsibleai/agent-control-spec)"
              echo
              echo "\`\`\`"
              printf "%b" "$DRIFT"
              echo
              echo "\`\`\`"
              echo
              echo "**Action:** update \`$FIXTURES\` to match upstream and re-run"
              echo "\`AcsManifestConformanceTest\` locally. Rationale for any"
              echo "intentional divergence belongs in that test's Javadoc."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "✅ fixtures in sync with upstream"

      - name: Open issue on drift
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'MS Agent Governance YAML fixtures drifted';
            const body = `The weekly upstream conformance check detected drift in \`modules/ai/src/test/resources/ms-acs/\`.

            See the failed workflow run for the diff:
            ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

            To resolve, pull the latest upstream ACS manifest fixtures and update our copies, or document the intentional divergence in \`AcsManifestConformanceTest\`.`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['governance', 'upstream-drift'],
            });
            if (issues.data.some(i => i.title === title)) {
              console.log('Existing drift issue already open; skipping.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['governance', 'upstream-drift'],
            });
