name: "CI: Native Image"

on:
  # `-am` in the install step transitively compiles modules/ai + modules/wasync,
  # so a doclint / compile break in those modules fails Native Image even
  # though they are not direct `-pl` targets. Trigger on them too.
  #
  # The AI dispatch job below was removed once, and the reason it was removed is
  # gone: annotation discovery now survives Native Image. Handlers are resolved
  # from a build-time index (the javac annotation processor in atmosphere-runtime,
  # plus the Spring AOT processor) instead of a classpath scan that finds nothing
  # in an image with no .class files. Re-adding it is the only way to learn
  # whether @AiEndpoint and @Agent work natively — that remains unproven until
  # this job is green.
  push:
    branches: [ main ]
    paths:
      - 'modules/cpr/**'
      - 'modules/ai/**'
      - 'modules/wasync/**'
      - 'modules/admin/**'
      - 'modules/agent/**'
      - 'modules/channels/**'
      - 'modules/checkpoint/**'
      - 'modules/skills/**'
      - 'modules/spring-boot-starter/**'
      - 'modules/spring-boot3-starter/**'
      - 'modules/quarkus-extension/**'
      - 'samples/spring-boot-chat/**'
      - 'samples/spring-boot-ai-chat/**'
      - 'samples/quarkus-chat/**'
      - '.mvn/**'
      - 'pom.xml'
      - '.github/workflows/native-image-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'modules/cpr/**'
      - 'modules/ai/**'
      - 'modules/wasync/**'
      - 'modules/admin/**'
      - 'modules/agent/**'
      - 'modules/channels/**'
      - 'modules/checkpoint/**'
      - 'modules/skills/**'
      - 'modules/spring-boot-starter/**'
      - 'modules/spring-boot3-starter/**'
      - 'modules/quarkus-extension/**'
      - 'samples/spring-boot-chat/**'
      - 'samples/spring-boot-ai-chat/**'
      - 'samples/quarkus-chat/**'
      - '.mvn/**'
      - 'pom.xml'
      - '.github/workflows/native-image-ci.yml'
  workflow_dispatch:

jobs:
  spring-boot-native:
    name: Spring Boot Native Image
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up GraalVM 25
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: 'maven'

    - name: Install Atmosphere Modules
      run: ./mvnw -B install -DskipTests -Dgpg.skip=true -pl modules/cpr,modules/spring-boot-starter,modules/wasync -am

    - name: Build Spring Boot Native Image
      run: ./mvnw -B -Pnative package -DskipTests -Dgpg.skip=true -pl samples/spring-boot-chat
      timeout-minutes: 20

    - name: Verify Native Binary Exists
      run: |
        BINARY=$(find samples/spring-boot-chat/target -maxdepth 1 -name 'atmosphere-spring-boot-chat*' -not -name '*.jar' -not -name '*.jar.original' -not -name '*.txt' -type f -executable | head -1)
        if [ -z "$BINARY" ]; then
          echo "Native binary not found. Contents of target/:"
          ls -lh samples/spring-boot-chat/target/
          exit 1
        fi
        echo "NATIVE_BINARY=$BINARY" >> "$GITHUB_ENV"
        ls -lh "$BINARY"
        file "$BINARY"

    - name: Smoke Test Native Binary
      run: |
        LOG=$(mktemp)
        "$NATIVE_BINARY" > "$LOG" 2>&1 &
        PID=$!
        trap 'kill $PID 2>/dev/null || true' EXIT

        started=0
        for i in $(seq 1 30); do
          if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
            echo "Application started successfully"
            started=1
            break
          fi
          sleep 1
        done
        if [ "$started" -ne 1 ]; then
          echo "Application failed to start within 30 seconds"
          sed -n '1,120p' "$LOG"
          exit 1
        fi

        # Booting is not the feature. This sample's entire point is the
        # @ManagedService at /atmosphere/chat, and in a native image Atmosphere
        # cannot scan .class files for it — the class is found only because the
        # build recorded it in META-INF/atmosphere/annotated-classes.txt. A
        # liveness URL answers either way, so drive a real connection and check
        # that the annotated @Ready method ran: that single log line can only
        # appear if the class was discovered, the handler registered, the
        # broadcaster and its by-name-loaded cache were created, @Inject
        # resolved, and the lifecycle fired.
        #
        # Registration itself is silent (ManagedServiceProcessor calls
        # addAtmosphereHandler with no logging), so there is no "installed"
        # line to grep — asserting behaviour is both more honest and the only
        # option available.
        #
        # Scope: this drives long-polling. WebSocket, SSE and transport
        # fallback under native are not exercised by this lane.
        echo "--- connecting to /atmosphere/chat ---"
        curl -s --max-time 8 \
          "http://localhost:8080/atmosphere/chat?X-Atmosphere-tracking-id=0&X-Atmosphere-Framework=2.3&X-Atmosphere-Transport=long-polling&X-Cache-Date=0" \
          > /dev/null 2>&1 || true
        sleep 2

        if grep -q "connected (broadcaster:" "$LOG"; then
          echo "PASS: @ManagedService(/atmosphere/chat) served a real connection under Native Image"
          exit 0
        fi
        echo "FAIL: connecting to the annotated endpoint did not run @Ready."
        echo "--- application log ---"
        sed -n '1,150p' "$LOG"
        exit 1

    - name: Set up Node (WebSocket client)
      uses: actions/setup-node@v7
      with:
        node-version: '22'

    - name: Assert WebSocket @Message round-trip under Native Image
      shell: bash
      run: |
        # Distinct port from the smoke step above. That step's instance takes
        # ~2s to release its listener after SIGTERM, which is longer than a step
        # transition; sharing 8080 means this step can be answered by the
        # previous step's process (or vice versa). Measured, not assumed.
        PORT="${PORT:-8099}"
        LOG=$(mktemp)
        CLIENT="${RUNNER_TEMP:-/tmp}/ws-roundtrip.mjs"
        ECHO_OUT=$(mktemp)

        dump_and_fail() {
          echo "FAIL: $1"
          echo "--- application log (first 120 lines) ---"
          sed -n '1,120p' "$LOG"
          echo "--- application log (last 120 lines) ---"
          tail -n 120 "$LOG"
          exit 1
        }

        # Refuse a false pass: if anything already answers on this port, every
        # assertion below could be satisfied by that process instead of the
        # binary under test. This exact situation was reproduced during review —
        # a stale instance served the whole WebSocket round-trip while the
        # launched binary never started. scripts/sample-startup-smoke.sh:140-143
        # carries the same guard for the same reason.
        if curl -s -o /dev/null --max-time 3 "http://127.0.0.1:$PORT/" 2>/dev/null; then
          echo "FAIL: port $PORT already answers before boot — refusing a false pass"
          exit 1
        fi

        # TRACE on the managed-handler package only. Invoker.matchDecoder swallows a
        # decoder failure with logger.trace("", e), and Invoker.invokeMethod swallows the
        # IllegalArgumentException that follows the same way — so at INFO a broken
        # encoder/decoder is completely silent and the server looks healthy. That is the
        # exact shape this step exists to catch, so raise the level that turns a silent
        # failure into a stack trace in the dump below.
        #
        # The WebTransport sidecar (application.yml, UDP 4443) is irrelevant here and
        # would collide with any other instance on the runner; turn it off.
        "$NATIVE_BINARY" --server.port="$PORT" \
                         --atmosphere.web-transport.enabled=false \
                         --logging.level.org.atmosphere.config.managed=TRACE > "$LOG" 2>&1 &
        PID=$!
        trap 'kill "$PID" 2>/dev/null || true' EXIT

        # Startup gate ONLY, deliberately not an assertion: /actuator/health answers
        # whether or not Atmosphere registered anything. It just says the process is far
        # enough along to be worth driving. The kill -0 check is what makes "my binary
        # died" report as "my binary died" instead of as a broken feature.
        started=0
        for _ in $(seq 1 60); do
          if ! kill -0 "$PID" 2>/dev/null; then
            dump_and_fail "the native binary exited during startup (pid $PID is gone)"
          fi
          if curl -sf "http://127.0.0.1:$PORT/actuator/health" > /dev/null 2>&1; then
            started=1; break
          fi
          sleep 1
        done
        if [ "$started" -ne 1 ]; then
          dump_and_fail "native binary did not start within 60s"
        fi

        # Bind the evidence to THIS process. An empty log with a healthy port means
        # something else is answering, and every assertion below would be measuring
        # the wrong server.
        if [ ! -s "$LOG" ]; then
          dump_and_fail "the launched binary produced no output — the health probe was answered by another process"
        fi

        NONCE="ws-echo-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-$RANDOM"
        AUTHOR="NativeSmoke"
        WS_URL="ws://127.0.0.1:$PORT/atmosphere/chat?X-Atmosphere-Transport=websocket&X-Atmosphere-Framework=5.0.0"

        cat > "$CLIENT" <<'CLIENT_EOF'
        // Opens a real WebSocket to the @ManagedService, sends one chat message and
        // waits for the broadcast echo of it. stdout: the matching frame, nothing else.
        const [URL_, AUTHOR, NONCE] = process.argv.slice(2);
        const DEADLINE_MS = 25000;
        if (typeof globalThis.WebSocket !== 'function') {
          console.error('ENV-FAIL: Node ' + process.version + ' has no global WebSocket (need >= 22).');
          process.exit(2);
        }
        const seen = [];
        let done = false;
        const fail = (msg) => {
          if (done) return;
          done = true;
          console.error(msg);
          console.error('--- non-padding frames received (' + seen.length + ') ---');
          for (const f of seen) console.error(f);
          process.exit(1);
        };
        const ws = new WebSocket(URL_);
        ws.addEventListener('error', () => fail(
          'FAIL: WebSocket did not connect to ' + URL_ +
          ' — the upgrade was refused (no jakarta.websocket ServerContainer?).'));
        ws.addEventListener('close', (e) => fail(
          'FAIL: WebSocket closed before the echo arrived (code=' + e.code + ').'));
        ws.addEventListener('open', () => {
          const payload = JSON.stringify({ author: AUTHOR, message: NONCE });
          // Re-send on an interval. A broadcast fired before this resource is in the
          // broadcaster's suspended set is dropped, so a single shot is racy on a
          // loaded runner — WAsyncChatIntegrationTest.awaitBroadcasterSubscribers
          // exists for the same reason. The nonce never changes, so the log
          // assertion stays exact however many sends land.
          const send = () => {
            if (done) return;
            try { ws.send(payload); }
            catch (e) { console.error('send failed: ' + (e && e.message)); }
          };
          send();
          const t = setInterval(send, 1500);
          setTimeout(() => clearInterval(t), DEADLINE_MS);
        });
        ws.addEventListener('message', (ev) => {
          const text = String(ev.data).trim();
          if (!text || text.startsWith('<!--')) return;  // padding / heartbeat noise
          seen.push(text);
          let o;
          // A non-JSON frame is itself the finding: when the encoder class fails to
          // load, Invoker.matchEncoder returns the *un-encoded* bean and the wire gets
          // "...chat.Message@1f2e3d". Keep collecting so that lands in the dump.
          try { o = JSON.parse(text); } catch { return; }
          if (o === null || typeof o !== 'object') return;
          if (o.author !== AUTHOR || o.message !== NONCE) return;
          done = true;
          console.log(text);
          process.exit(0);
        });
        setTimeout(() => fail('FAIL: no echo of the sent message within ' + DEADLINE_MS + 'ms.'),
          DEADLINE_MS + 1000);
        CLIENT_EOF

        echo "--- driving a real WebSocket against /atmosphere/chat ---"
        rc=0
        timeout 60 node "$CLIENT" "$WS_URL" "$AUTHOR" "$NONCE" > "$ECHO_OUT" || rc=$?

        if [ "$rc" -eq 124 ]; then
          dump_and_fail "the WebSocket client did not terminate within 60s (its own deadline is 26s) — treat as a hang, not a pass."
        fi
        if [ "$rc" -eq 2 ]; then
          dump_and_fail "the runner's Node has no WebSocket support, so the assertion could not run. This is an environment defect, not a pass."
        fi
        if [ "$rc" -ne 0 ]; then
          dump_and_fail "the WebSocket round-trip did not complete (client diagnostics above)."
        fi

        ECHO_FRAME=$(cat "$ECHO_OUT")
        echo "echo frame: $ECHO_FRAME"

        # Assertion 1 — the ENCODER ran and broadcast fan-out reached this socket.
        # Matching the field VALUES, not merely "some JSON arrived", is load-bearing: an
        # unregistered DTO serialises to {} and an unloadable encoder yields a bare
        # toString(). The client sends no "time", so a verbatim re-echo of the sent
        # payload also fails this check — only a real decode->invoke->encode adds it.
        if ! jq -e --arg a "$AUTHOR" --arg m "$NONCE" \
             '.author == $a and .message == $m and (.time | type) == "number" and .time > 0' \
             <<< "$ECHO_FRAME" > /dev/null 2>&1; then
          dump_and_fail "the echoed frame is not a fully-encoded Message: $ECHO_FRAME"
        fi

        # Assertion 2 — the DECODER ran and produced a populated DTO, in THIS process.
        # Chat.onMessage logs both getters; a raw String that was never decoded cannot
        # reach that method. Because $LOG is this binary's own stdout, this is also what
        # ties assertion 1's frame to the binary under test.
        if ! grep -qF "$AUTHOR just sent $NONCE" "$LOG"; then
          dump_and_fail "@Message never ran with a decoded Message (no '$AUTHOR just sent $NONCE' in the log)."
        fi

        echo "PASS: WebSocket upgrade + @Message decode + encode + broadcast fan-out all work under Native Image"

    - name: Upload Native Binary
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: spring-boot-native-artifacts
        path: samples/spring-boot-chat/target/

  spring-boot-ai-native:
    name: Spring Boot AI Native Image
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up GraalVM 25
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: 'maven'

    - name: Install Atmosphere Modules
      run: ./mvnw -B install -DskipTests -Dgpg.skip=true -pl samples/spring-boot-ai-chat -am

    - name: Build Spring Boot AI Native Image
      run: ./mvnw -B -Pnative package -DskipTests -Dgpg.skip=true -pl samples/spring-boot-ai-chat
      timeout-minutes: 30

    - name: Verify Native Binary Exists
      run: |
        BINARY=$(find samples/spring-boot-ai-chat/target -maxdepth 1 -name 'atmosphere-spring-boot-ai-chat*' -not -name '*.jar' -not -name '*.jar.original' -not -name '*.txt' -type f -executable | head -1)
        if [ -z "$BINARY" ]; then
          echo "Native binary not found. Contents of target/:"
          ls -lh samples/spring-boot-ai-chat/target/
          exit 1
        fi
        echo "NATIVE_BINARY=$BINARY" >> "$GITHUB_ENV"
        ls -lh "$BINARY"

    # The point of this lane. The two other native targets contain zero
    # @AiEndpoint / @Agent call sites, so they only ever proved a server can
    # start. This dispatches a real agent turn through the OpenAI-compatible
    # surface and asserts the model's text came back — keyless, because with no
    # API key configured DemoAgentRuntime wins runtime resolution and answers
    # through the same pipeline (guardrails, interceptors, metrics) a real
    # provider would.
    - name: Smoke Test AI Dispatch Under Native Image
      env:
        # The sample enables the SQLite tape; keep it off the source tree.
        ATMOSPHERE_TAPE_PATH: ${{ runner.temp }}/tape.db
      run: |
        "$NATIVE_BINARY" &
        PID=$!
        trap 'kill $PID 2>/dev/null || true' EXIT

        # Readiness is probed on GET /atmosphere/v1/models, not /actuator/health:
        # this sample does not depend on spring-boot-starter-actuator, so the
        # health endpoint the other native job uses would never answer here.
        # The models endpoint is part of the surface under test anyway.
        for i in $(seq 1 60); do
          if curl -sf http://localhost:8080/atmosphere/v1/models > /dev/null 2>&1; then
            echo "Application started"
            break
          fi
          if [ "$i" -eq 60 ]; then
            echo "Application failed to start within 60 seconds"
            exit 1
          fi
          sleep 1
        done

        RESPONSE=$(curl -sf -X POST http://localhost:8080/atmosphere/v1/chat/completions \
          -H 'Content-Type: application/json' \
          -H 'X-Atmosphere-Auth: demo-token' \
          -d '{"model":"atmosphere-ai-chat","messages":[{"role":"user","content":"native smoke"}]}') || {
            echo "AI dispatch request failed"
            exit 1
          }

        echo "$RESPONSE"
        CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
        if [ -z "$CONTENT" ]; then
          echo "No assistant content returned — the agent did not dispatch under Native Image."
          echo "A server that merely starts is what this lane already proved; it must run an agent."
          exit 1
        fi
        echo "AI dispatch produced content under Native Image"

    - name: Upload Native Binary
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: spring-boot-ai-native-artifacts
        path: samples/spring-boot-ai-chat/target/

  quarkus-native:
    name: Quarkus Native Image
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        # Supply-chain hardening: GPG-verify the Temurin JDK archive (setup-java >= v5.5.0)
        verify-signature: true
        cache: 'maven'

    - name: Install Atmosphere Modules
      run: ./mvnw -B install -DskipTests -Dgpg.skip=true

    - name: Build Quarkus Native Image (container build)
      run: ./mvnw -B -Dnative -Dquarkus.native.container-build=true -Dquarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-21 package -DskipTests -Dgpg.skip=true -pl samples/quarkus-chat
      timeout-minutes: 20

    - name: Verify Native Binary Exists
      run: |
        ls -lh samples/quarkus-chat/target/*-runner
        file samples/quarkus-chat/target/*-runner

    - name: Smoke Test Native Binary
      run: |
        LOG=$(mktemp)
        samples/quarkus-chat/target/*-runner > "$LOG" 2>&1 &
        PID=$!
        trap 'kill $PID 2>/dev/null || true' EXIT

        started=0
        for i in $(seq 1 30); do
          if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
            echo "Application started successfully"
            started=1
            break
          fi
          sleep 1
        done
        if [ "$started" -ne 1 ]; then
          echo "Application failed to start within 30 seconds"
          sed -n '1,120p' "$LOG"
          exit 1
        fi

        # Same assertion as the Spring Boot lane, over a different build-time
        # index: Quarkus builds Atmosphere's annotation map from Jandex
        # (AtmosphereProcessor#scanAnnotations), not from
        # META-INF/atmosphere/annotated-classes.txt. Jandex alone was never
        # sufficient, though — the endpoints it registered still failed to come
        # up until the broadcaster caches, which are loaded by name, were
        # registered for reflection. Serving "/" only proved a static page
        # exists; this drives long-polling and greps the @Ready log line, and
        # covers nothing beyond that.
        echo "--- connecting to /atmosphere/chat ---"
        curl -s --max-time 8 \
          "http://localhost:8080/atmosphere/chat?X-Atmosphere-tracking-id=0&X-Atmosphere-Framework=2.3&X-Atmosphere-Transport=long-polling&X-Cache-Date=0" \
          > /dev/null 2>&1 || true
        sleep 2

        if grep -q "connected (broadcaster:" "$LOG"; then
          echo "PASS: @ManagedService(/atmosphere/chat) served a real connection under Native Image"
          exit 0
        fi
        echo "FAIL: connecting to the annotated endpoint did not run @Ready."
        echo "--- application log ---"
        sed -n '1,150p' "$LOG"
        exit 1

    - name: Upload Native Binary
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: quarkus-native-artifacts
        path: samples/quarkus-chat/target/
