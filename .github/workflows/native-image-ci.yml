name: "CI: Native Image"

on:
  # `-am` in the install step transitively compiles modules/ai + modules/wasync,
  # so a doclint / compile break in those modules fails Native Image even
  # though they are not direct `-pl` targets. Trigger on them too.
  #
  # A native AI-dispatch job lived here and was removed when Atmosphere's
  # annotation-driven model could not survive Native Image: the Spring Boot
  # starter discovered @ManagedService / @AiEndpoint / @Agent with a runtime
  # classpath scan, a native image has no .class files to scan, so every
  # annotated user class went undetected and the starter silently fell back to
  # its built-in default endpoint.
  #
  # That blocker is gone. Discovery in the Spring Boot starter is now the union
  # of the runtime scan and a build-time index — a union and not "index wins",
  # because an index is per-artifact and letting one short-circuit the scan lets
  # a single jar hide every other jar's classes. Two things write that index,
  # both to META-INF/atmosphere/annotated-classes.txt:
  # AtmosphereAnnotationScanAotProcessor (Spring AOT, registered in the
  # starter's META-INF/spring/aot.factories) and, for any build tool,
  # org.atmosphere.nativeimage.AtmosphereAnnotationIndexProcessor — a javac
  # annotation processor auto-discovered from atmosphere-runtime on the compile
  # classpath.
  #
  # Reflective access is a separate problem with a separate fix.
  # atmosphere-runtime ships
  # META-INF/native-image/org.atmosphere/atmosphere-runtime/reachability-metadata.json,
  # generated from the org.atmosphere.nativeimage.NativeImageMetadataProvider
  # SPI, so a plain-servlet deployment needs no integration module. A module
  # declares the types it loads by name by implementing that interface:
  #
  #   public final class MyMetadataProvider implements NativeImageMetadataProvider {
  #       @Override public String name() { return "atmosphere-mymodule"; }
  #       @Override public Collection<String> reflectiveTypes() {
  #           return List.of("com.example.LoadedByName");
  #       }
  #   }
  #
  # and listing it in
  # META-INF/services/org.atmosphere.nativeimage.NativeImageMetadataProvider.
  # NativeImageMetadata.collect() merges every provider on the classpath and
  # feeds all three integrations: AtmosphereRuntimeHints in both Spring starters
  # and the Quarkus deployment processor. modules/spring-boot3-starter is in the
  # path filters below for that reason — it is one of the three, and the Quarkus
  # lane's install step is a full-reactor build, so a break there fails this
  # workflow and must be able to trigger it. samples/spring-boot-ai-chat is in
  # the filters only because that same full-reactor install compiles it; it is
  # not evidence of AI coverage.
  #
  # WHAT THE TWO JOBS BELOW ASSERT, AND NOTHING MORE: a @ManagedService serves a
  # real long-polling connection under Native Image, on Spring Boot and on
  # Quarkus. Not asserted, and therefore not proven: WebSocket under native,
  # SSE, transport negotiation and fallback, @Message encoder/decoder
  # round-trips, @RoomService / presence / broadcast fan-out, and injection
  # beyond what @Ready needs. The AI lane has not been re-added — no job in this
  # repository builds samples/spring-boot-ai-chat with -Pnative or -Dnative, so
  # @AiEndpoint and @Agent under Native Image remain unproven. Do not read a
  # green run here as "Atmosphere supports GraalVM Native Image".
  push:
    branches: [ main ]
    paths:
      - 'modules/cpr/**'
      - 'modules/ai/**'
      - 'modules/wasync/**'
      - 'modules/spring-boot-starter/**'
      - 'modules/spring-boot3-starter/**'
      - 'modules/quarkus-extension/**'
      - 'samples/spring-boot-chat/**'
      - 'samples/spring-boot-ai-chat/**'
      - 'samples/quarkus-chat/**'
      - '.mvn/**'
      - 'pom.xml'
      - '.github/workflows/native-image-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'modules/cpr/**'
      - 'modules/ai/**'
      - 'modules/wasync/**'
      - 'modules/spring-boot-starter/**'
      - 'modules/spring-boot3-starter/**'
      - 'modules/quarkus-extension/**'
      - 'samples/spring-boot-chat/**'
      - 'samples/spring-boot-ai-chat/**'
      - 'samples/quarkus-chat/**'
      - '.mvn/**'
      - 'pom.xml'
      - '.github/workflows/native-image-ci.yml'
  workflow_dispatch:

jobs:
  spring-boot-native:
    name: Spring Boot Native Image
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up GraalVM 25
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: 'maven'

    - name: Install Atmosphere Modules
      run: ./mvnw -B install -DskipTests -Dgpg.skip=true -pl modules/cpr,modules/spring-boot-starter,modules/wasync -am

    - name: Build Spring Boot Native Image
      run: ./mvnw -B -Pnative package -DskipTests -Dgpg.skip=true -pl samples/spring-boot-chat
      timeout-minutes: 20

    - name: Verify Native Binary Exists
      run: |
        BINARY=$(find samples/spring-boot-chat/target -maxdepth 1 -name 'atmosphere-spring-boot-chat*' -not -name '*.jar' -not -name '*.jar.original' -not -name '*.txt' -type f -executable | head -1)
        if [ -z "$BINARY" ]; then
          echo "Native binary not found. Contents of target/:"
          ls -lh samples/spring-boot-chat/target/
          exit 1
        fi
        echo "NATIVE_BINARY=$BINARY" >> "$GITHUB_ENV"
        ls -lh "$BINARY"
        file "$BINARY"

    - name: Smoke Test Native Binary
      run: |
        LOG=$(mktemp)
        "$NATIVE_BINARY" > "$LOG" 2>&1 &
        PID=$!
        trap 'kill $PID 2>/dev/null || true' EXIT

        started=0
        for i in $(seq 1 30); do
          if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
            echo "Application started successfully"
            started=1
            break
          fi
          sleep 1
        done
        if [ "$started" -ne 1 ]; then
          echo "Application failed to start within 30 seconds"
          sed -n '1,120p' "$LOG"
          exit 1
        fi

        # Booting is not the feature. This sample's entire point is the
        # @ManagedService at /atmosphere/chat, and in a native image Atmosphere
        # cannot scan .class files for it — the class is found only because the
        # build recorded it in META-INF/atmosphere/annotated-classes.txt. A
        # liveness URL answers either way, so drive a real connection and check
        # that the annotated @Ready method ran: that single log line can only
        # appear if the class was discovered, the handler registered, the
        # broadcaster and its by-name-loaded cache were created, @Inject
        # resolved, and the lifecycle fired.
        #
        # Registration itself is silent (ManagedServiceProcessor calls
        # addAtmosphereHandler with no logging), so there is no "installed"
        # line to grep — asserting behaviour is both more honest and the only
        # option available.
        #
        # Scope: this drives long-polling. WebSocket, SSE and transport
        # fallback under native are not exercised by this lane.
        echo "--- connecting to /atmosphere/chat ---"
        curl -s --max-time 8 \
          "http://localhost:8080/atmosphere/chat?X-Atmosphere-tracking-id=0&X-Atmosphere-Framework=2.3&X-Atmosphere-Transport=long-polling&X-Cache-Date=0" \
          > /dev/null 2>&1 || true
        sleep 2

        if grep -q "connected (broadcaster:" "$LOG"; then
          echo "PASS: @ManagedService(/atmosphere/chat) served a real connection under Native Image"
          exit 0
        fi
        echo "FAIL: connecting to the annotated endpoint did not run @Ready."
        echo "--- application log ---"
        sed -n '1,150p' "$LOG"
        exit 1

    - name: Upload Native Binary
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: spring-boot-native-artifacts
        path: samples/spring-boot-chat/target/

  quarkus-native:
    name: Quarkus Native Image
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        # Supply-chain hardening: GPG-verify the Temurin JDK archive (setup-java >= v5.5.0)
        verify-signature: true
        cache: 'maven'

    - name: Install Atmosphere Modules
      run: ./mvnw -B install -DskipTests -Dgpg.skip=true

    - name: Build Quarkus Native Image (container build)
      run: ./mvnw -B -Dnative -Dquarkus.native.container-build=true -Dquarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-21 package -DskipTests -Dgpg.skip=true -pl samples/quarkus-chat
      timeout-minutes: 20

    - name: Verify Native Binary Exists
      run: |
        ls -lh samples/quarkus-chat/target/*-runner
        file samples/quarkus-chat/target/*-runner

    - name: Smoke Test Native Binary
      run: |
        LOG=$(mktemp)
        samples/quarkus-chat/target/*-runner > "$LOG" 2>&1 &
        PID=$!
        trap 'kill $PID 2>/dev/null || true' EXIT

        started=0
        for i in $(seq 1 30); do
          if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
            echo "Application started successfully"
            started=1
            break
          fi
          sleep 1
        done
        if [ "$started" -ne 1 ]; then
          echo "Application failed to start within 30 seconds"
          sed -n '1,120p' "$LOG"
          exit 1
        fi

        # Same assertion as the Spring Boot lane, over a different build-time
        # index: Quarkus builds Atmosphere's annotation map from Jandex
        # (AtmosphereProcessor#scanAnnotations), not from
        # META-INF/atmosphere/annotated-classes.txt. Jandex alone was never
        # sufficient, though — the endpoints it registered still failed to come
        # up until the broadcaster caches, which are loaded by name, were
        # registered for reflection. Serving "/" only proved a static page
        # exists; this drives long-polling and greps the @Ready log line, and
        # covers nothing beyond that.
        echo "--- connecting to /atmosphere/chat ---"
        curl -s --max-time 8 \
          "http://localhost:8080/atmosphere/chat?X-Atmosphere-tracking-id=0&X-Atmosphere-Framework=2.3&X-Atmosphere-Transport=long-polling&X-Cache-Date=0" \
          > /dev/null 2>&1 || true
        sleep 2

        if grep -q "connected (broadcaster:" "$LOG"; then
          echo "PASS: @ManagedService(/atmosphere/chat) served a real connection under Native Image"
          exit 0
        fi
        echo "FAIL: connecting to the annotated endpoint did not run @Ready."
        echo "--- application log ---"
        sed -n '1,150p' "$LOG"
        exit 1

    - name: Upload Native Binary
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: quarkus-native-artifacts
        path: samples/quarkus-chat/target/
