name: "CI: Native Image"

on:
  # `-am` in the install step transitively compiles modules/ai + modules/wasync,
  # so a doclint / compile break in those modules fails Native Image even
  # though they are not direct `-pl` targets. Trigger on them too.
  push:
    branches: [ main ]
    paths:
      - 'modules/cpr/**'
      - 'modules/ai/**'
      - 'modules/wasync/**'
      - 'modules/spring-boot-starter/**'
      - 'modules/quarkus-extension/**'
      - 'samples/spring-boot-chat/**'
      - 'samples/spring-boot-ai-chat/**'
      - 'samples/quarkus-chat/**'
      - '.mvn/**'
      - 'pom.xml'
      - '.github/workflows/native-image-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'modules/cpr/**'
      - 'modules/ai/**'
      - 'modules/wasync/**'
      - 'modules/spring-boot-starter/**'
      - 'modules/quarkus-extension/**'
      - 'samples/spring-boot-chat/**'
      - 'samples/spring-boot-ai-chat/**'
      - 'samples/quarkus-chat/**'
      - '.mvn/**'
      - 'pom.xml'
      - '.github/workflows/native-image-ci.yml'
  workflow_dispatch:

jobs:
  spring-boot-native:
    name: Spring Boot Native Image
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up GraalVM 25
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: 'maven'

    - name: Install Atmosphere Modules
      run: ./mvnw -B install -DskipTests -Dgpg.skip=true -pl modules/cpr,modules/spring-boot-starter,modules/wasync -am

    - name: Build Spring Boot Native Image
      run: ./mvnw -B -Pnative package -DskipTests -Dgpg.skip=true -pl samples/spring-boot-chat
      timeout-minutes: 20

    - name: Verify Native Binary Exists
      run: |
        BINARY=$(find samples/spring-boot-chat/target -maxdepth 1 -name 'atmosphere-spring-boot-chat*' -not -name '*.jar' -not -name '*.jar.original' -not -name '*.txt' -type f -executable | head -1)
        if [ -z "$BINARY" ]; then
          echo "Native binary not found. Contents of target/:"
          ls -lh samples/spring-boot-chat/target/
          exit 1
        fi
        echo "NATIVE_BINARY=$BINARY" >> "$GITHUB_ENV"
        ls -lh "$BINARY"
        file "$BINARY"

    - name: Smoke Test Native Binary
      run: |
        "$NATIVE_BINARY" &
        PID=$!
        # Wait for startup (native images start fast)
        for i in $(seq 1 30); do
          if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
            echo "Application started successfully"
            kill $PID
            exit 0
          fi
          sleep 1
        done
        echo "Application failed to start within 30 seconds"
        kill $PID 2>/dev/null || true
        exit 1

    - name: Upload Native Binary
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: spring-boot-native-artifacts
        path: samples/spring-boot-chat/target/

  spring-boot-ai-native:
    name: Spring Boot AI Native Image
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up GraalVM 25
      uses: graalvm/setup-graalvm@v1
      with:
        java-version: '25'
        distribution: 'graalvm'
        cache: 'maven'

    - name: Install Atmosphere Modules
      run: ./mvnw -B install -DskipTests -Dgpg.skip=true -pl samples/spring-boot-ai-chat -am

    - name: Build Spring Boot AI Native Image
      run: ./mvnw -B -Pnative package -DskipTests -Dgpg.skip=true -pl samples/spring-boot-ai-chat
      timeout-minutes: 30

    - name: Verify Native Binary Exists
      run: |
        BINARY=$(find samples/spring-boot-ai-chat/target -maxdepth 1 -name 'atmosphere-spring-boot-ai-chat*' -not -name '*.jar' -not -name '*.jar.original' -not -name '*.txt' -type f -executable | head -1)
        if [ -z "$BINARY" ]; then
          echo "Native binary not found. Contents of target/:"
          ls -lh samples/spring-boot-ai-chat/target/
          exit 1
        fi
        echo "NATIVE_BINARY=$BINARY" >> "$GITHUB_ENV"
        ls -lh "$BINARY"

    # The point of this lane. The two other native targets contain zero
    # @AiEndpoint / @Agent call sites, so they only ever proved a server can
    # start. This dispatches a real agent turn through the OpenAI-compatible
    # surface and asserts the model's text came back — keyless, because with no
    # API key configured DemoAgentRuntime wins runtime resolution and answers
    # through the same pipeline (guardrails, interceptors, metrics) a real
    # provider would.
    - name: Smoke Test AI Dispatch Under Native Image
      env:
        # The sample enables the SQLite tape; keep it off the source tree.
        ATMOSPHERE_TAPE_PATH: ${{ runner.temp }}/tape.db
      run: |
        "$NATIVE_BINARY" &
        PID=$!
        trap 'kill $PID 2>/dev/null || true' EXIT

        # Readiness is probed on GET /atmosphere/v1/models, not /actuator/health:
        # this sample does not depend on spring-boot-starter-actuator, so the
        # health endpoint the other native job uses would never answer here.
        # The models endpoint is part of the surface under test anyway.
        for i in $(seq 1 60); do
          if curl -sf http://localhost:8080/atmosphere/v1/models > /dev/null 2>&1; then
            echo "Application started"
            break
          fi
          if [ "$i" -eq 60 ]; then
            echo "Application failed to start within 60 seconds"
            exit 1
          fi
          sleep 1
        done

        RESPONSE=$(curl -sf -X POST http://localhost:8080/atmosphere/v1/chat/completions \
          -H 'Content-Type: application/json' \
          -H 'X-Atmosphere-Auth: demo-token' \
          -d '{"model":"atmosphere-ai-chat","messages":[{"role":"user","content":"native smoke"}]}') || {
            echo "AI dispatch request failed"
            exit 1
          }

        echo "$RESPONSE"
        CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
        if [ -z "$CONTENT" ]; then
          echo "No assistant content returned — the agent did not dispatch under Native Image."
          echo "A server that merely starts is what this lane already proved; it must run an agent."
          exit 1
        fi
        echo "AI dispatch produced content under Native Image"

    - name: Upload Native Binary
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: spring-boot-ai-native-artifacts
        path: samples/spring-boot-ai-chat/target/

  quarkus-native:
    name: Quarkus Native Image
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        # Supply-chain hardening: GPG-verify the Temurin JDK archive (setup-java >= v5.5.0)
        verify-signature: true
        cache: 'maven'

    - name: Install Atmosphere Modules
      run: ./mvnw -B install -DskipTests -Dgpg.skip=true

    - name: Build Quarkus Native Image (container build)
      run: ./mvnw -B -Dnative -Dquarkus.native.container-build=true -Dquarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-21 package -DskipTests -Dgpg.skip=true -pl samples/quarkus-chat
      timeout-minutes: 20

    - name: Verify Native Binary Exists
      run: |
        ls -lh samples/quarkus-chat/target/*-runner
        file samples/quarkus-chat/target/*-runner

    - name: Smoke Test Native Binary
      run: |
        samples/quarkus-chat/target/*-runner &
        PID=$!
        for i in $(seq 1 30); do
          if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
            echo "Application started successfully"
            kill $PID
            exit 0
          fi
          sleep 1
        done
        echo "Application failed to start within 30 seconds"
        kill $PID 2>/dev/null || true
        exit 1

    - name: Upload Native Binary
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: quarkus-native-artifacts
        path: samples/quarkus-chat/target/
