name: "CI: Benchmarks"

on:
  push:
    branches: [main]
    paths:
      - 'modules/cpr/**'
      - 'modules/ai/**'
      - 'modules/checkpoint/**'
      - 'modules/coordinator/**'
      - 'modules/benchmarks/**'
      - 'scripts/benchmarks/**'
      - '.mvn/**'
      - 'pom.xml'
      - '.github/workflows/benchmarks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'modules/cpr/**'
      - 'modules/ai/**'
      - 'modules/checkpoint/**'
      - 'modules/coordinator/**'
      - 'modules/benchmarks/**'
      - 'scripts/benchmarks/**'
      - '.mvn/**'
      - 'pom.xml'
      - '.github/workflows/benchmarks.yml'
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  jmh:
    name: JMH Micro-Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          # Supply-chain hardening: GPG-verify the Temurin JDK archive (setup-java >= v5.5.0)
          verify-signature: true
          cache: maven

      - name: Build benchmarks
        run: ./mvnw -Pperf -pl modules/benchmarks -am package -DskipTests -q

      - name: Run JMH (CI mode — minimal iterations for regression detection)
        run: |
          mkdir -p target
          java -jar modules/benchmarks/target/benchmarks.jar \
            -f 1 -wi 1 -i 3 \
            -rf json -rff target/jmh-results.json

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        with:
          name: 'Atmosphere JMH Benchmarks'
          tool: 'jmh'
          output-file-path: target/jmh-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Store history on a dedicated branch (not gh-pages, which
          # serves async-io.org). The benchmark-data branch is data-only;
          # the dashboard HTML is viewable locally via gh-pages or from
          # the atmosphere.github.io docs site if linked.
          gh-pages-branch: benchmark-data
          auto-push: ${{ github.ref == 'refs/heads/main' }}
          alert-threshold: '115%'
          comment-on-alert: true
          # Advisory only: the full suite spans lock-contention and
          # fan-out benchmarks whose scores swing with shared-runner
          # noise well past any usable threshold. The enforcing leg is
          # the jmh-gate job below, which runs a curated deterministic
          # subset with a threshold sized for runner variance.
          fail-on-alert: false
          benchmark-data-dir-path: 'dev/bench'

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jmh-results
          path: target/jmh-results.json

  jmh-gate:
    # Enforcing regression gate on a curated deterministic subset.
    #
    # Why a separate leg instead of fail-on-alert on the full suite:
    # the full matrix mixes in concurrency-sensitive benchmarks whose
    # scores depend on thread scheduling — the vt-pinning job below
    # already singles out Checkpoint + Broadcaster as the most
    # lock-sensitive, and CoordinatorFanOutBenchmark measures
    # virtual-thread scheduling overhead by its own definition. Those
    # swing with runner load, so the full-suite leg stays advisory.
    # AiInterceptorChain and PolicyEval are single-threaded, in-memory
    # CPU benchmarks (no executors, threads, or latches) whose inputs
    # are built from fixed values in @Setup, and they cover hot paths
    # worth protecting: per-turn interceptor dispatch and governance
    # admission.
    #
    # The gate is a same-runner A/B: the subset runs for the base commit
    # (the previous main for a push, the merge-base for a PR) and for the
    # candidate, in this job, on this machine, and
    # scripts/benchmarks/ab-gate.py fails only when a benchmark is more
    # than 2x slower AND the gap exceeds both runs' error bars. The old
    # gate compared against scores stored from earlier runners; on
    # 2026-09-24 every gated benchmark read ~2x slower on one runner
    # while a local A/B of the same commits showed no change. The stored
    # history (dev/bench-gate) is kept for charts, advisory only.
    name: JMH Regression Gate (stable subset)
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          # Supply-chain hardening: GPG-verify the Temurin JDK archive (setup-java >= v5.5.0)
          verify-signature: true
          cache: maven

      - name: Build benchmarks
        run: ./mvnw -Pperf -pl modules/benchmarks -am package -DskipTests -q

      - name: Run curated JMH subset (more iterations for stable scores)
        run: |
          mkdir -p target
          java -jar modules/benchmarks/target/benchmarks.jar \
            'AiInterceptorChainBenchmark|PolicyEvalBenchmark' \
            -f 1 -wi 3 -i 5 \
            -rf json -rff target/jmh-gate-results.json

      - name: Resolve the base commit
        id: base
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            BASE=$(git merge-base "$PR_BASE" HEAD)
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          else
            BASE=$(git rev-parse HEAD~1)
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          echo "A/B base commit: $BASE"

      - name: Build and run the same subset at the base commit
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/bench-base" "$BASE"
          cd "$RUNNER_TEMP/bench-base"
          ./mvnw -Pperf -pl modules/benchmarks -am package -DskipTests -q
          java -jar modules/benchmarks/target/benchmarks.jar \
            'AiInterceptorChainBenchmark|PolicyEvalBenchmark' \
            -f 1 -wi 3 -i 5 \
            -rf json -rff "$GITHUB_WORKSPACE/target/jmh-gate-base.json"

      - name: Gate on hot-path regression (same-runner A/B)
        run: python3 scripts/benchmarks/ab-gate.py target/jmh-gate-base.json target/jmh-gate-results.json --threshold 2.0

      - name: Record gate history (advisory chart)
        uses: benchmark-action/github-action-benchmark@v1
        if: github.ref == 'refs/heads/main'
        with:
          name: 'Atmosphere JMH Stable Gate'
          tool: 'jmh'
          output-file-path: target/jmh-gate-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: benchmark-data
          auto-push: true
          alert-threshold: '200%'
          comment-on-alert: false
          fail-on-alert: false
          benchmark-data-dir-path: 'dev/bench-gate'

      - name: Upload gate results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jmh-gate-results
          path: |
            target/jmh-gate-results.json
            target/jmh-gate-base.json

  vt-pinning:
    name: Virtual Thread Pinning Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          # Supply-chain hardening: GPG-verify the Temurin JDK archive (setup-java >= v5.5.0)
          verify-signature: true
          cache: maven

      - name: Build benchmarks
        run: ./mvnw -Pperf -pl modules/benchmarks -am package -DskipTests -q

      - name: Check for VT pinning (Checkpoint + Broadcaster — most lock-sensitive)
        run: |
          scripts/benchmarks/vt-pinning-check.sh "Checkpoint|Broadcaster" \
            -p snapshotCount=1000 -p subscriberCount=10

      - name: Upload JFR recording
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vt-pinning-jfr
          path: target/jmh-results/vt-pinning-*.jfr
