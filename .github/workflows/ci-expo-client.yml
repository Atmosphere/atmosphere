name: "CI: Expo classroom client"

# The Expo client is not a Maven module and no Playwright suite reaches it, so
# without this workflow its unit tests and type check ran nowhere. It links
# atmosphere.js by file path, so a client-library change is checked here too.
on:
  push:
    branches: [ main ]
    paths:
      - 'samples/spring-boot-ai-classroom/expo-client/**'
      - 'atmosphere.js/src/**'
      - 'atmosphere.js/package.json'
      - '.github/workflows/ci-expo-client.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'samples/spring-boot-ai-classroom/expo-client/**'
      - 'atmosphere.js/src/**'
      - 'atmosphere.js/package.json'
      - '.github/workflows/ci-expo-client.yml'

jobs:
  test:
    name: Unit tests + type check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.4

    - name: Build atmosphere.js (the client links its dist/)
      working-directory: atmosphere.js
      run: |
        npm ci
        npm run build

    - name: Install
      working-directory: samples/spring-boot-ai-classroom/expo-client
      run: bun install --frozen-lockfile

    - name: Unit tests
      working-directory: samples/spring-boot-ai-classroom/expo-client
      run: bun test

    - name: Type check
      working-directory: samples/spring-boot-ai-classroom/expo-client
      run: bunx tsc --noEmit

    # bun installs the file:-linked atmosphere.js as a copy carrying its own
    # devDependencies, React among them; a second React in the bundle breaks
    # every hook at runtime ("Invalid hook call"). Bundle as Metro does for the
    # device and assert a single react and react-native copy.
    - name: Bundle and assert a single React
      working-directory: samples/spring-boot-ai-classroom/expo-client
      env:
        CI: "1"
      run: |
        bunx expo export --platform ios --source-maps --output-dir "$RUNNER_TEMP/expo-export"
        node scripts/check-single-react.mjs "$RUNNER_TEMP/expo-export"
