name: "CI: Obsidian Writer Skill"

# Runs the obsidian-writer skill's suite (.claude/skills/obsidian-writer/test.sh),
# which drives vault-sync.sh pull and push against real git repositories in a
# temp dir: no vault checkout, no network. The contract under test is the exit
# status — a session reads 0 from push as "published", so the suite pins that
# push exits 0 only when origin/main holds every named file exactly as committed
# (whatever else the rebase kept, whatever shape the path had), that pull and
# push exit non-zero when local commits leave main or the rebase does not run,
# that the guards fire before anything is staged, and that a rebase failing
# without a conflict resets nothing.
#
# Path-filtered to the skill; seconds, no Maven build.

on:
  push:
    branches: [main]
    paths:
      - '.claude/skills/obsidian-writer/**'
      - '.github/workflows/obsidian-writer.yml'
  pull_request:
    paths:
      - '.claude/skills/obsidian-writer/**'
      - '.github/workflows/obsidian-writer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vault-sync:
    name: vault-sync pull and push outcomes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Install shellcheck
      run: |
        command -v shellcheck > /dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
        shellcheck --version | head -2

    - name: shellcheck
      run: shellcheck -S warning .claude/skills/obsidian-writer/vault-sync.sh .claude/skills/obsidian-writer/test.sh

    - name: Suite
      run: bash .claude/skills/obsidian-writer/test.sh
