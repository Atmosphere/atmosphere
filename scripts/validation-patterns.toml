# Atmosphere Framework - Architectural Validation Patterns
# This file defines patterns that indicate code quality anti-patterns.
# Used by scripts/architectural-validation.sh

# ============================================================================
# PLACEHOLDER PATTERNS — code that pretends to work but doesn't
# ============================================================================

[placeholder_patterns]
# Critical: code left by AI assistants or incomplete implementations
critical = [
    "Implementation would",
    "Would implement",
    "Should implement",
    "Will implement",
    "TODO: Implementation",
    "stub implementation",
    "stub for now",
    "mock implementation",
    "placeholder implementation",
    "placeholder structure",
    "simplified placeholder",
    "this is a placeholder",
    "will be implemented",
    "to be implemented",
    "not yet.*implemented",
    "return mock data",
    "fake implementation",
    "in a real app",
    "for demo purposes",
    "temporary solution",
    "temp fix",
    "quick fix"
]

# Hedge language — avoiding commitment (warning only)
hedge = [
    "might implement",
    "could implement",
    "should handle",
    "if needed",
    "when required"
]

# ============================================================================
# NON-SHIPPED MODULES — test-support and perf harnesses, not product code
# ============================================================================

[non_shipped_modules]
# The production-hygiene checks (mock/stub, System.out, printStackTrace) ask
# "would a user of the published jar see this?". These modules publish nothing,
# so the question does not apply: benchmarks exists to build synthetic fixtures
# and print numbers to a console, and integration-tests exists to be a fixture.
#
# NOT a convenience allowlist — every entry is verified against its pom on each
# run (see verify_non_shipped in architectural-validation.sh). Listing a module
# that actually deploys fails the build, so this list cannot be used to smuggle
# product code out of the checks.
#
# Evidence (re-verified by the gate, quoted here for readers):
#   modules/benchmarks/pom.xml        <maven.deploy.skip>true</maven.deploy.skip>
#   modules/integration-tests/pom.xml maven-deploy-plugin  <skip>true</skip>
#                                     maven-install-plugin <skip>true</skip>
modules = [
    "benchmarks",
    "integration-tests"
]

# ============================================================================
# MOCK / STUB EXCLUSIONS — legitimate uses of mock/stub/fake words
# ============================================================================

[mock_exclusions]
# File-level exclusions (these files legitimately use mock/stub/fake words)
files = [
    "FakeHttpSession.java",
    "FakeLlmClient.java"
]

# Word-level false positives (words containing mock/stub/fake but not meaning it)
false_positive_words = [
    "socket",
    "dock",
    "block",
    "knock",
    "unstub",
    "clock",
    "newStub",
    "newWorkflowStub",
    "blockingStub",
    "Grpc",
    "noOpsRequest",
    "AtmosphereRequestImpl"
]

# NOTE: every bare key of [mock_exclusions] must stay ABOVE the
# [[mock_exclusions.wiring_sites]] block below. TOML binds subsequent bare keys
# to the most recent table header, so a key placed after the array-of-tables
# silently becomes a field of wiring_sites[0] instead. That is not theoretical:
# false_positive_words was briefly stranded there, which emptied
# MOCK_FALSE_POSITIVES, turned the mock check's `grep -viE "$EMPTY"` into a
# match-everything filter, and made the whole check pass vacuously. Add new bare
# keys above this line.

# Production sites that WIRE a legitimately-named fake, rather than leaking a
# stub. `atmosphere.ai.mode=fake` is a documented, shipped config mode: it
# selects FakeLlmClient so the samples run with no API key, and AiConfig logs
# the choice at startup. The mode is a product feature, so the word "fake" in
# its wiring is the feature's real name --- not a placeholder someone forgot.
#
# Scoped to file + symbol, deliberately: a bare file exclusion would let a real
# stub land in AiConfig unnoticed. Any mock/stub/fake hit in these files that
# does NOT match the paired regex still fails.
[[mock_exclusions.wiring_sites]]
file = "AiConfig.java"
pattern = '"fake"\.equalsIgnoreCase\(mode\)|new FakeLlmClient\(|mode=fake'
reason = "wires the documented atmosphere.ai.mode=fake demo mode"

# ============================================================================
# AI STATE BELONGS TO THE APPLICATION — architectural-validation.sh check 15
# ============================================================================
#
# Framework code that can reach an AtmosphereFramework, AtmosphereConfig,
# AtmosphereResource or an AgentRuntime it was attached to reads AI settings,
# knobs, runtimes and native-client bindings through that application's
# AiEnvironment. The AiConfig and AgentRuntimeResolver statics, and the
# AiEnvironment.current()/bound() lookup behind them, read whichever
# application the calling thread is bound to, else the only one running, else
# the process default: with two applications in one JVM, on a thread bound to
# none, that is no one application's (the rule in AGENTS.md, Correctness
# Invariants #1 and #5).
#
# The check scans every modules/**/src/main (Java and Kotlin, nested Quarkus
# modules included; not the non-shipped modules, not samples, which are user
# code) in CODE mode: comments, Javadoc and imports other than static imports
# are not code reads. A static import of these classes is flagged, since it
# would hide every call behind a bare name.
#
# Every hit must match an [[ai_application_state.allowed]] entry, file + regex,
# with a reason. An entry that matches nothing fails the check (stale), so the
# list can only shrink to what is true. This file is not under modules/, so the
# check never reads its own allowlist as a consumer.
[ai_application_state]
static_classes = ["AiConfig", "AgentRuntimeResolver"]
# The statics that read or write an application's AI state. The pure helpers
# (resolveBaseUrl, parseGenerationParams, knobs, knobProperties,
# warnIfLocalModeOverridden, the LlmSettings record) are not listed: they hold
# no state.
static_methods = [
    "get", "knob", "forAgent", "agentScoped", "resetAgent",
    "resolve", "resolveAll",
    "resolvePromptCacheKeyMode", "resolveLogprobsMode",
    "resolveNativeStructuredOutputMode", "resolvePlanningMode",
    "resolveFilesystemMode", "resolveGenerationParams",
    "resolveEmbeddingModel", "resolveReattachGrace",
    "configure", "configureForAgent", "installClient",
    "fromEnvironment", "settingsFromEnvironment", "getOrConfigureFromEnvironment",
    "reportKnobsNotInEffect",
    "hasExplicitClientBinding", "markExplicitClientBinding"
]
# The thread-binding lookup the statics delegate to.
ambient_methods = ["current", "bound"]

# --- The static API itself ---------------------------------------------------
[[ai_application_state.allowed]]
file = "org/atmosphere/ai/AiConfig.java"
pattern = 'AiEnvironment\.current\(\)'
reason = "the AiConfig statics are the facade: each reads or writes AiEnvironment.current()"

[[ai_application_state.allowed]]
file = "org/atmosphere/ai/AgentRuntimeResolver.java"
pattern = 'AiEnvironment\.current\(\)'
reason = "the AgentRuntimeResolver statics are the facade over AiEnvironment.current()"

[[ai_application_state.allowed]]
file = "org/atmosphere/ai/EmbeddingRuntimeResolver.java"
pattern = 'AiEnvironment\.current\(\)\.embeddings\(\)'
reason = "the EmbeddingRuntimeResolver statics are the facade over AiEnvironment.current()"

[[ai_application_state.allowed]]
file = "org/atmosphere/ai/decision/DecisionModelResolver.java"
pattern = 'resolve\(AiEnvironment\.current\(\)\)'
reason = "the no-argument DecisionModelResolver.resolve() is the facade; callers holding an application use resolve(environment)"

[[ai_application_state.allowed]]
file = "org/atmosphere/ai/AiEnvironment.java"
pattern = 'orElseGet\(AiEnvironment::current\)'
reason = "resolveRuntime(config): a framework with no environment attached has no application of its own"

# --- The thread binding (design: bound on the @Prompt thread, the gateway worker and generate's carrier) ---
[[ai_application_state.allowed]]
file = "org/atmosphere/ai/AgentRuntime.java"
pattern = 'AiEnvironment\.bound\(\)'
reason = "generate() carries the caller's binding onto its carrier thread, so an inline and a bounded call read the same application (Mode Parity)"

# --- An instance no environment attached (built by hand, or by the process default) ---
[[ai_application_state.allowed]]
file = "org/atmosphere/ai/AbstractAgentRuntime.java"
pattern = 'attached != null \? attached : AiEnvironment\.current\(\)|effectiveModel\(AiEnvironment\.current\(\), context, defaultModel\)'
reason = "environment() of a runtime no registry attached, and the protected static effectiveModel kept for subclasses; registry-built instances are attached"

[[ai_application_state.allowed]]
file = "org/atmosphere/ai/RoutingAiSupport.java"
pattern = 'attached != null \? attached : AiEnvironment\.current\(\)'
reason = "a routing runtime built by hand, outside a processor, has no application"

[[ai_application_state.allowed]]
file = "org/atmosphere/ai/llm/DemoAgentRuntime.java"
pattern = 'attached != null \? attached : org\.atmosphere\.ai\.AiEnvironment\.current\(\)'
reason = "availability of a demo runtime no registry attached"

[[ai_application_state.allowed]]
file = "org/atmosphere/ai/llm/BuiltInEmbeddingRuntime.java"
pattern = 'attached != null \? attached : AiEnvironment\.current\(\)'
reason = "an embedding runtime no registry attached"

[[ai_application_state.allowed]]
file = "LangChain4jEmbeddingRuntime.java"
pattern = 'attached != null \? attached : AiEnvironment\.current\(\)'
reason = "an embedding runtime no registry attached"

[[ai_application_state.allowed]]
file = "SemanticKernelEmbeddingRuntime.java"
pattern = 'attached != null \? attached : AiEnvironment\.current\(\)'
reason = "an embedding runtime no registry attached"

[[ai_application_state.allowed]]
file = "SpringAiEmbeddingRuntime.java"
pattern = 'attached != null \? attached : AiEnvironment\.current\(\)'
reason = "an embedding runtime no registry attached"

[[ai_application_state.allowed]]
file = "SpringAiAlibabaEmbeddingRuntime.java"
pattern = 'attached != null \? attached : AiEnvironment\.current\(\)'
reason = "an embedding runtime no registry attached"

[[ai_application_state.allowed]]
file = "EmbabelEmbeddingRuntime.kt"
pattern = 'environment \?: AiEnvironment\.current\(\)'
reason = "an embedding runtime no registry attached"

[[ai_application_state.allowed]]
file = "KoogEmbeddingRuntime.kt"
pattern = 'environment \?: AiEnvironment\.current\(\)'
reason = "an embedding runtime no registry attached"

[[ai_application_state.allowed]]
file = "EmbabelAgentRuntime.kt"
pattern = 'environment \?: AiEnvironment\.current\(\)|resolveAgentFileSystem\(AiEnvironment\.current\(\), session\)'
reason = "environment() of a runtime no registry attached (it implements AgentRuntime directly), and the internal no-application test seam"

[[ai_application_state.allowed]]
file = "KoogAgentRuntime.kt"
pattern = 'environment \?: AiEnvironment\.current\(\)|shouldObservePlan\(AiEnvironment\.current\(\), context\)'
reason = "environment() of a runtime no registry attached (it implements AgentRuntime directly), and the internal no-application test seam"

[[ai_application_state.allowed]]
file = "LlmResultEvaluator.java"
pattern = 'attached != null \? attached : AiEnvironment\.current\(\)'
reason = "an evaluator no coordinator attached (ResultEvaluator.attach)"

[[ai_application_state.allowed]]
file = "AnthropicMessagesClient.java"
pattern = 'environment != null \? environment : org\.atmosphere\.ai\.AiEnvironment\.current\(\)'
reason = "a client built by hand, with no runtime that owns it"

[[ai_application_state.allowed]]
file = "ChannelAiBridge.java"
pattern = 'aiEnvironment != null \? aiEnvironment : AiEnvironment\.current\(\)'
reason = "a bridge built without the context's AiEnvironment bean (no Atmosphere starter in the context)"

# --- Package-private test seams of the adapters, whose dispatch path passes environment() ---
[[ai_application_state.allowed]]
file = "AdkAgentRuntime.java"
pattern = 'resolveAgentFileSystem\(AiEnvironment\.current\(\), session\)'
reason = "package-private test seam; dispatch calls the overload taking environment()"

[[ai_application_state.allowed]]
file = "AgentScopeAgentRuntime.java"
pattern = 'provisionPlanNotebook\(AiEnvironment\.current\(\), context, session\)'
reason = "package-private test seam; dispatch calls the overload taking environment()"

[[ai_application_state.allowed]]
file = "SemanticKernelAgentRuntime.java"
pattern = 'currentGeneration\(AiEnvironment\.current\(\)\)'
reason = "package-private test seam; dispatch passes currentGeneration(environment())"

[[ai_application_state.allowed]]
file = "SpringAiAlibabaAgentRuntime.java"
pattern = 'provisionPlanSurface\(AiEnvironment\.current\(\), context, session\)'
reason = "package-private test seam; dispatch calls the overload taking environment()"

# --- Public entry points that take no application (library use, user code) ---
[[ai_application_state.allowed]]
file = "org/atmosphere/ai/LlmReranker.java"
pattern = 'AiEnvironment\.current\(\)\.runtimes\(\)\.resolve\(\)'
reason = "a reranker built with no runtime supplier; RagRetrieval.resolve passes the application's"

[[ai_application_state.allowed]]
file = "org/atmosphere/ai/LlmSummarizingCompaction.java"
pattern = 'AiEnvironment\.current\(\)\.runtimes\(\)\.resolve\(\)'
reason = "the public constructors take no application; CompactionConfig passes the application's runtime"

[[ai_application_state.allowed]]
file = "SpawnSubagentTool.java"
pattern = 'AiEnvironment\.current\(\)\.runtimes\(\)\.resolve\(\)'
reason = "the one-argument constructor takes no application; the coordinator registers the tool with its own"

[[ai_application_state.allowed]]
file = "org/atmosphere/ai/llm/OpenAiCompatibleClient.java"
pattern = 'AiEnvironment\.current\(\)\.resolve(PromptCacheKeyMode|LogprobsMode)\(\)'
reason = "a client built directly, with no settings, belongs to no application; settings-built clients get both modes from their application"

[[ai_application_state.allowed]]
file = "org/atmosphere/ai/workspace/WorkspaceExtensions.java"
pattern = 'AiEnvironment\.current\(\)\)\.settings\(\)|AiConfig\.configureForAgent\(|AiConfig\.configure\('
