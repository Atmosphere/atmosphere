# jqwik configuration for the modules/ai property tests (*PropertyTest).
#
# CI reproducibility: on a falsified property jqwik prints the random seed it
# used, and `after-failure = SAMPLE_FIRST` replays that exact falsifying sample
# first on the next run. Seeds are reported in the failure output rather than
# stored in the repo, so a CI failure reproduces locally by passing the printed
# seed — no machine-specific .jqwik-database is committed (it is gitignored).
jqwik.seeds.whenfixed = ALLOW
jqwik.failures.after.default = SAMPLE_FIRST
# Shrink falsifying samples to their minimal form so a failure names the
# smallest input that breaks the property, not the first random one found.
jqwik.shrinking.default = FULL
# Report the generated-value distribution only on failure — keeps green runs quiet.
jqwik.reporting.onlyfailures = true
