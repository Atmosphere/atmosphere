# Per-room scope config for the AI classroom sample.
#
# Operators tune each room's purpose, forbidden topics, and scope tier
# without rebuilding the app. RoomScopesConfig reads this on startup
# and exposes a Map<String, ScopeConfig> that RoomContextInterceptor
# consumes.
#
# Atmosphere is the only JVM framework with per-request scope install
# (via REQUEST_SCOPE_METADATA_KEY) — YAML-backed per-room scope turns
# that Java-only pattern into an ops-controllable configuration surface.
#
# The wording matters to the model, not only to the guardrail. The framework
# quotes purpose, forbiddenTopics and redirectMessage into the system prompt
# and tells the model to reply with exactly the redirect when a request is
# out of scope; the scope guardrail does the actual enforcement. Measured on
# qwen2.5:3b and qwen2.5:7b, three wordings made the model refuse in-scope
# questions, so avoid them:
#   - a redirect that names the room's subject ("ask me about a mathematics
#     topic"): for a math question it reads as the answer;
#   - a forbidden topic that starts with "writing": it matches "Write a
#     lesson on ...";
#   - a purpose that leaves out lessons and worked examples.
# RoomPromptContractTest pins these rules.

version: "1.0"
default: general

rooms:
  math:
    systemPrompt: >
      You are an expert mathematics tutor. Explain concepts clearly with
      step-by-step examples. Use precise mathematical notation. Keep
      responses under 300 words.
    purpose: >
      Mathematics tutoring — arithmetic, algebra, calculus, geometry,
      statistics, proof technique, including lessons, worked examples and
      step-by-step solutions
    forbiddenTopics:
      - debugging or writing source code in a programming language
      - programming tutorials
      - poems, stories or other creative writing
    onBreach: POLITE_REDIRECT
    redirectMessage: "That is outside this room's subject — please ask it in another room."
    tier: RULE_BASED
    similarityThreshold: 0.45

  code:
    systemPrompt: >
      You are an expert software engineer and programming mentor. Provide
      clear, idiomatic code examples with explanations. Favor readability
      over cleverness. Keep responses under 300 words.
    purpose: >
      Software engineering mentoring — programming languages, debugging,
      algorithms, design patterns, testing, including lessons, worked
      examples and code samples
    forbiddenTopics:
      - medical advice
      - legal advice
      - financial advice
    onBreach: POLITE_REDIRECT
    redirectMessage: "That is outside this room's subject — please ask it in another room."
    tier: RULE_BASED
    similarityThreshold: 0.45

  science:
    systemPrompt: >
      You are a science educator specializing in physics, chemistry, and
      biology. Use analogies and real-world examples to make concepts
      accessible. Keep responses under 300 words.
    purpose: >
      Science education — physics, chemistry, biology, earth science,
      scientific method, including lessons, worked examples and experiments
    forbiddenTopics:
      - debugging or writing source code in a programming language
      - programming tutorials
      - medical diagnosis
      - poems, stories or other creative writing
    onBreach: POLITE_REDIRECT
    redirectMessage: "That is outside this room's subject — please ask it in another room."
    tier: RULE_BASED
    similarityThreshold: 0.45

  general:
    systemPrompt: >
      You are a helpful classroom assistant. Answer questions clearly and
      concisely. Keep responses under 300 words.
    purpose: >
      General educational assistance — broad-band tutoring across
      academic subjects, including lessons, worked examples and study skills
    forbiddenTopics:
      - medical diagnosis
      - legal advice
      - financial advice
    onBreach: POLITE_REDIRECT
    redirectMessage: "Sorry, I can't help with that request here."
    tier: RULE_BASED
    similarityThreshold: 0.45
