spring.application.name=atmosphere-durable-sessions

# Atmosphere
atmosphere.packages=org.atmosphere.samples.springboot.durable
atmosphere.servlet-path=/atmosphere/*

# Enable durable sessions — survive server restarts
atmosphere.durable-sessions.enabled=true
atmosphere.durable-sessions.session-ttl=1440m
atmosphere.durable-sessions.cleanup-interval=60s

# How long the chat's UUIDBroadcasterCache keeps what a disconnected client
# missed, in SECONDS (default 60). Durable sessions are about coming back, so
# the cache must outlast the client's retries: the bundled Console makes 10
# reconnect attempts, waiting 3 s doubling to a 25 s cap (at most
# 3+6+12+24+6x25 = 195 s), so with the 60 s default an outage of ~100 s lost
# every message broadcast meanwhile. 300 s covers that whole window. The
# reaper (invalidateCacheInterval, 30 s) only drops a client already idle
# longer than this, so it can keep messages up to 30 s longer, never shorter.
# A message is also dropped once older than messageTTL (300 s, set here so the
# two limits are read together).
atmosphere.init-params[org.atmosphere.cache.UUIDBroadcasterCache.clientIdleTime]=300
atmosphere.init-params[org.atmosphere.cache.UUIDBroadcasterCache.messageTTL]=300
