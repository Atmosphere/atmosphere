quarkus.atmosphere.packages=org.atmosphere.samples.quarkus.chat
# The bundled Atmosphere Console (quarkus-admin-extension) is the sample UI;
# / redirects there. Broadcast chat over the @ManagedService endpoint.
quarkus.atmosphere.console-subtitle=Multi-client broadcast chat on Quarkus
quarkus.atmosphere.console-endpoint=/atmosphere/chat
quarkus.log.category."org.atmosphere".level=DEBUG
quarkus.log.category."io.undertow.websockets".level=DEBUG

# Admin control plane — writes disabled unless explicitly enabled via env.
# CI sets ATMOSPHERE_ADMIN_HTTP_WRITE_ENABLED=true + ATMOSPHERE_ADMIN_AUTH_TOKEN
# so the admin-quarkus.spec.ts write tests can authenticate via
# X-Atmosphere-Auth against a known token (demo-token).
atmosphere.admin.http-write-enabled=${ATMOSPHERE_ADMIN_HTTP_WRITE_ENABLED:false}
atmosphere.admin.auth.token=${ATMOSPHERE_ADMIN_AUTH_TOKEN:}

# netty 4.1.136.Final (pinned above Quarkus 3.36.3's 4.1.135 for the codec
# GHSA batch) statically reaches io.netty.internal.tcnative.* from
# SslContext during native-image analysis; the JNI-backed class inits fail
# in the builder (UnsatisfiedLinkError: sslSignRsaPkcsSha1), so the whole
# package moves to run-time initialization — along with the two
# io.netty.handler.ssl private-key-method interfaces whose constants are
# getstatic reads of those JNI-backed values (the only two such interfaces
# in the package, per javap over netty-handler 4.1.136).
quarkus.native.additional-build-args=--initialize-at-run-time=io.netty.internal.tcnative,--initialize-at-run-time=io.netty.handler.ssl.OpenSslPrivateKeyMethod,--initialize-at-run-time=io.netty.handler.ssl.OpenSslAsyncPrivateKeyMethod
