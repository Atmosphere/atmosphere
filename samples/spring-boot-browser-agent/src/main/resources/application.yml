# Atmosphere Code-as-Action Browser Agent Sample
# The AI writes Playwright code that drives a headless browser in an isolated
# sandbox container; screenshots stream back to the Console live.

atmosphere:
  console-subtitle: Code-as-action agent driving a headless browser
  packages: org.atmosphere.samples.springboot.browseragent
  web-transport:
    enabled: true
    port: 4446

# Cohere Command (tool-calling capable, no aggressive free-tier rate limit).
# The Cohere AgentRuntime is priority 100, so with COHERE_API_KEY set the SPI
# resolver forces it over the built-in fallback.
llm:
  # Placeholder form for consistency with every other sample, NOT a bug fix:
  # this block was already reachable by LLM_MODE. Nothing on this sample's
  # classpath binds the `llm.*` prefix — it pulls no langchain4j/koog/spring-ai
  # module, and AtmosphereProperties binds `atmosphere.*` — so the previous
  # literals were inert and the env var already won. Contrast
  # spring-boot-channels-chat, where `atmosphere.ai.mode` IS read by
  # AtmosphereAiAutoConfiguration.resolveMode() and a literal there really did
  # make LLM_MODE=local unreachable.
  mode: ${LLM_MODE:remote}
  model: ${LLM_MODEL:command-a-03-2025}
  api-key: ${COHERE_API_KEY:}

server:
  port: 8090
