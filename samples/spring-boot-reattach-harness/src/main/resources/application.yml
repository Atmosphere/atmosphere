server:
  port: 8096

atmosphere:
  packages: org.atmosphere.samples.springboot.reattach
  # Two @AiEndpoints live here; the Console talks to the session.send emitter.
  console-endpoint: /atmosphere/agent/harness
  auth:
    # The reattach harness is a CI-only surface; leave auth off so the
    # Playwright spec can focus on the reattach contract without carrying
    # an auth token dance.
    enabled: false

# No model configuration: the @Prompt in SlowEmitterChat emits canned events
# with Thread.sleep, the SyntheticRunController pre-populates the registry
# directly, and SlowModelChat streams from the in-process PacedModelClient,
# which HarnessModelConfiguration installs whatever LLM_* the host exports.
logging:
  level:
    org.atmosphere.ai.resume: DEBUG
    org.atmosphere.samples.springboot.reattach: DEBUG
