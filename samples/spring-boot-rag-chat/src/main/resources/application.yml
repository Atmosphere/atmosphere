# Atmosphere RAG Chat - Configuration
# Supports any OpenAI-compatible API: Gemini, Ollama, OpenAI, Azure, etc.

atmosphere:
  console-subtitle: RAG-powered AI chat with document retrieval
  packages: org.atmosphere.samples.springboot.ragchat
  ai:
    rag:
      # Second-stage LLM reranker: retrieval over-fetches 3x the top-5 slot
      # (15 candidates) and one batched completion on the endpoint's runtime
      # scores them back down to the 5 most relevant. Fails open to the
      # retriever order on any error/timeout — in keyless demo mode the demo
      # runtime's canned reply is unparseable, so ranking simply falls back.
      reranker: llm
  web-transport:
    enabled: true
    port: 4445

# LLM Configuration
# Set via .envrc, environment variables, or override here.
#
# LLM_MODE: "remote" (cloud API, default) or "local" (Ollama)
# LLM_MODEL: model name (e.g. gemini-2.5-flash, gpt-4o, llama3.2)
# LLM_API_KEY or GEMINI_API_KEY: API key for remote providers
# LLM_BASE_URL: override the API endpoint (auto-detected from mode if omitted)
#
# Example .envrc for Gemini:
#   export LLM_MODE=remote
#   export LLM_MODEL=gemini-2.5-flash
#   export LLM_API_KEY=AIza...
#
# Example .envrc for OpenAI:
#   export LLM_MODE=remote
#   export LLM_MODEL=gpt-4o-mini
#   export LLM_BASE_URL=https://api.openai.com/v1
#   export LLM_API_KEY=sk-...
llm:
  mode: ${LLM_MODE:remote}
  model: ${LLM_MODEL:gemini-2.5-flash}
  base-url: ${LLM_BASE_URL:}
  api-key: ${LLM_API_KEY:${GEMINI_API_KEY:}}

# Spring AI OpenAI configuration (used for embeddings)
# The API key is shared with the LLM config above
spring:
  ai:
    openai:
      api-key: ${LLM_API_KEY:${GEMINI_API_KEY:}}
      # Spring AI appends /v1/chat/completions internally, so base-url must NOT include /v1.
      # Use SPRING_AI_BASE_URL to override, or defaults to Gemini.
      base-url: ${SPRING_AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      chat:
        options:
          model: ${LLM_MODEL:gemini-2.5-flash}
      embedding:
        options:
          # Distinct from LLM_MODEL (a chat model id): the embedding model has to
          # match whatever SPRING_AI_BASE_URL points at, so a local run pairs
          # SPRING_AI_BASE_URL=http://localhost:11434/v1 with
          # EMBEDDING_MODEL=nomic-embed-text. A literal here would make that
          # unreachable. Pinned by SampleLlmEnvPlaceholderLintTest.
          model: ${EMBEDDING_MODEL:text-embedding-004}

# Actuator — expose all metric endpoints
management:
  endpoints:
    web:
      exposure:
        include: "*"

server:
  port: 8080
